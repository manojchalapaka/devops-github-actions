name: Terraform Deployment Pipeline For AWS Batch 73

on:
#   pull_request:
#     types:
#       - closed
#     branches:
#       - development
#       - production
#     paths-ignore:
#       - 'ReadMe.md'

  push:
    branches:
      - development
      - production
    paths-ignore:
      - 'ReadMe.md'

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_REGION: ${{ vars.AWS_REGION }}
  ENV_DESTROY: "YES"
  TERRAFORM_DESTROY: ${{ vars.TERRAFORM_DESTROY }}
  TERRAFORM_VERSION: "1.13.4"

jobs: # Jobs List
  terraform-checkov:
    if: ${{ vars.TERRAFORM_DESTROY == 'NO' }}
    name: 'Stage_1 - Checkov Security Scanning For Terraform Code'
    runs-on: ubuntu-latest #Default Runner Provided By GitHub.
    defaults:
      run:
        working-directory: ./Alpha-Bravo
    steps:
      - name: Checkout The Code Repository
        uses: actions/checkout@v5
      - name: Print Runner Hostname
        run: echo $HOSTNAME
      - name: Setup Checkov For Security Scanning
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: ./Alpha-Bravo
          quiet: true
          soft_fail: true #Workflow Will Continue Even If Security Checks Fail.
          output_format: cli,json
          output_file_path: console,./Alpha-Bravo/results.json
      - name: Upload Checkov Results to S3 Bucket
        uses: koraykoska/s3-upload-github-action@master
        env:
          FILE: ./Alpha-Bravo/results.json
          S3_ENDPOINT: 's3.us-east-1.amazonaws.com'
          S3_BUCKET: "awsb73-checkov-security-reports" #S3 Bucket For Storing Checkov Security Reports.
          S3_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}